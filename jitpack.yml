# JitPack configuration for velitask-sdk
#
# velitask-sdk is not built from sources by JitPack — pre-built fat-jar is
# attached to GitHub Releases as assets. This file tells JitPack how to fetch it.
#
# Workflow:
#   1. JitPack receives request for com.github.velitask:velitask-sdk:X.Y.Z
#   2. Clones this repo at tag X.Y.Z
#   3. Runs install: below — downloads JAR + sources from the Release, installs to ~/.m2
#   4. Serves to the requesting client

jdk:
  - openjdk21

install:
  - curl -fSL -o velitask-sdk.jar
      "https://github.com/velitask/velitask-sdk/releases/download/$VERSION/velitask-sdk-${VERSION}.jar"
  - curl -fSL -o velitask-sdk-sources.jar
      "https://github.com/velitask/velitask-sdk/releases/download/$VERSION/velitask-sdk-${VERSION}-sources.jar"
  - mvn install:install-file
      -Dfile=velitask-sdk.jar
      -Dsources=velitask-sdk-sources.jar
      -DgroupId=com.github.velitask
      -DartifactId=velitask-sdk
      -Dversion=$VERSION
      -Dpackaging=jar
